name: CyberShield Sentinel Pro - CI/CD APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Assemble CyberShield APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Restore or create debug keystore
      run: |
        if [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        else
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=CyberShield,C=US"
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Assemble Debug APK
      run: ./gradlew assembleDebug --no-daemon -Pksp.incremental=false

    - name: Upload CyberShield APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CyberShield-Sentinel-Pro-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
